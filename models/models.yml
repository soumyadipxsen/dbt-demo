version: 2

models:
  - name: hub_customers
    description: >
      Customer hub contains one row per unique customer id.

    columns:
      - name: hk_customer
        description: "hash key generated from customer_id."
        data_type: binary
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "unique customer id."
        data_type: varchar
        data_tests:
          - not_null
          - unique

      - name: load_dt
        description: "Timestamp at which the record was loaded."
        data_tests:
          - not_null

      - name: source
        description: "Source  from which the record is loaded."
        data_type: varchar
        data_tests:
          - not_null

  - name: hub_product
    description: "Product hub containing one row per product id."

    columns:
      - name: hk_product
        description: "Hash key generated from product_id."
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: "Unique product id."
        data_tests:
          - not_null
          - unique

      - name: load_dt
        description: "Timestamp at which the product was first loaded."
        data_tests:
          - not_null

      - name: source
        description: "Source from which the record was loaded."
        data_tests:
          - not_null

  - name: link_customer_product
    description: >
      Link representing the relationship between a customer and a product.

    columns:
      - name: hk_customer_product
        description: "Hash key generated from customer_id and product_id."
        data_tests:
          - not_null
          - unique

      - name: hk_customer
        description: "Reference to hub_customer."
        data_tests:
          - not_null

      - name: hk_product
        description: "Reference to hub_product."
        data_tests:
          - not_null

      - name: load_dt
        description: "Timestamp at which the relationship was first loaded."
        data_tests:
          - not_null

      - name: source
        description: "Source that supplied the record."
        data_tests:
          - not_null

  - name: customer_sat
    description: "Descriptive attributes for customers."

    columns:
      - name: hk_customer
        description: "Parent customer hub hash key."
        data_tests:
          - not_null

      - name: load_dt
        description: "Start timestamp for this descriptive version."
        data_tests:
          - not_null

      - name: customer_hashdiff
        description: "Hash of the tracked customer attributes."
        data_tests:
          - not_null

      - name: customer_status
        description: "Customer status supplied by the source."
        data_tests:
          - accepted_values:
              arguments:
                values: ["ACTIVE", "INACTIVE"]
              config:
                severity: warn

  - name: product_sat
    description: "Historized descriptive attributes for products."

    columns:
      - name: hk_product
        description: "Parent product hub hash key."
        data_tests:
          - not_null

      - name: load_dt
        description: "Start timestamp for this descriptive version."
        data_tests:
          - not_null

      - name: product_hashdiff
        description: "Hash of the tracked product attributes."
        data_tests:
          - not_null